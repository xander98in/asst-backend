# ============================================================
# Perfil de PRODUCCIÓN
# Se activa con SPRING_PROFILES_ACTIVE=prod (variable de entorno)
# Sobrescribe valores de application.properties cuando este perfil está activo
# ============================================================

# ===== JPA en producción =====
# validate: solo verifica que el schema coincida con las entidades, no lo modifica
spring.jpa.hibernate.ddl-auto=validate

# No exponer SQL en logs de producción
spring.jpa.show-sql=false

# ===== Logging en producción =====
# Reducir verbosidad de logs SQL de Hibernate
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# Nivel global de la aplicación
logging.level.com.unicuaca.asst.unicauca_asst=INFO
