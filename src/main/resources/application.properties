spring.application.name=unicauca-asst

# ===== Server =====
server.port=${PORT:8080}

# ===== Database =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_asst}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA =====
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# ===== Google OAuth =====
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:611422532123-5d08k8boi712dtirdd14gsdrpt7f4km0.apps.googleusercontent.com}
google.allowed-domain=${GOOGLE_ALLOWED_DOMAIN:unicauca.edu.co}

# ===== JWT =====
jwt.secret=${JWT_SECRET:dzFlUziAshAOC3IYDb9URcBn4lx8T3yh20EdrbAKokQkRjxL0mQaa/lify7hSQd9tj1xeuSDSJFAjLgEYnM8GQ==}
jwt.access-token.expiration=${JWT_ACCESS_EXPIRATION:3600000}
jwt.refresh-token.expiration=${JWT_REFRESH_EXPIRATION:86400000}

# ===== CORS =====
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ===== Swagger =====
app.swagger.enabled=${SWAGGER_ENABLED:true}

# ===== Thymeleaf =====
spring.thymeleaf.check-template-location=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false