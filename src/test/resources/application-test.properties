# ===== Perfil de test — Base de datos H2 en memoria =====
spring.application.name=unicauca-asst

spring.datasource.url=jdbc:h2:mem:db_asst_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop

spring.jpa.open-in-view=false

# ===== Google OAuth (valores de prueba) =====
spring.security.oauth2.client.registration.google.client-id=test-google-client-id
google.allowed-domain=unicauca.edu.co

# ===== JWT (secreto de prueba — solo para tests) =====
jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3RzLW9ubHktZG8tbm90LXVzZS1pbi1wcm9kdWN0aW9uLWVudmlyb25tZW50
jwt.access-token.expiration=3600000
jwt.refresh-token.expiration=86400000

# ===== Thymeleaf =====
spring.thymeleaf.check-template-location=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
